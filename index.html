<script type="x-shader" id="fs">precision highp float;
uniform vec2 R;uniform float T;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}
const float HZ=.32;
float tree(float x){return HZ+.012+.03*n(vec2(x*9.,1.))+.014*n(vec2(x*45.,4.))+.006*n(vec2(x*160.,8.));}
vec3 sky(vec2 uv){
 float asp=R.x/R.y,y=max(uv.y-HZ,0.);
 vec2 q=vec2((uv.x-.5)*asp/(y+.2),1./(y+.2))*.85+vec2(T*.02,T*.012);
 vec2 wq=q+vec2(fbm(q*.6+T*.01),fbm(q*.6+7.))*1.3;
 float c=fbm(wq*1.1),c2=fbm((wq+vec2(.1,.13))*1.1);
 float dens=smoothstep(.3,.7,c+.14),shade=clamp(.5+(c-c2)*6.,0.,1.);
 vec2 mp=vec2(.7,.6);float md=length(vec2((uv.x-mp.x)*asp,uv.y-mp.y));
 float glow=exp(-md*3.)*.8+exp(-md*12.)*.7,thin=1.-smoothstep(.3,.75,c);
 vec3 mc=vec3(.62,.68,.85);
 vec3 cl=mix(vec3(.05,.06,.09),vec3(.4,.44,.54),shade*shade*.85+.1)+mc*glow*(.25+.9*thin);
 vec3 cr=mix(vec3(.26,.27,.34),vec3(.02,.03,.07),pow(clamp(y/.68,0.,1.),.55))+mc*glow*.3;
 vec3 col=mix(cr,cl,dens);
 col=mix(col,vec3(.36,.35,.42),exp(-y*9.)*.55)+vec3(.5,.36,.32)*exp(-y*16.)*.18;
 float k=floor(T*.35),ph=fract(T*.35),fl=step(.86,h(vec2(k,3.)))*exp(-ph*9.)*(.6+.4*sin(ph*60.));
 col+=vec3(.55,.6,.85)*fl*exp(-length(vec2((uv.x-.2-.6*h(vec2(k,7.)))*asp,uv.y-.62))*3.)*(.4+dens*.9);
 return col;}
void main(){
 vec2 uv=gl_FragCoord.xy/R;float asp=R.x/R.y;vec3 col;
 if(uv.y>=HZ){
  col=sky(uv);float tl=tree(uv.x*asp);
  col=mix(col,vec3(.03,.038,.05),smoothstep(tl+.002,tl-.002,uv.y));
 }else{
  float d=(HZ-uv.y)/HZ,pz=1./(d+.06);
  vec2 wp=vec2((uv.x-.5)*asp*pz,pz-T*.22);
  float w1=fbm(wp*vec2(1.6,3.)+vec2(T*.04,0.)),w2=fbm(wp*vec2(5.,8.)-vec2(0.,T*.1));
  float rip=(w1-.5)*.7+(w2-.5)*.5;
  vec2 ru=vec2(uv.x+rip*.035*(d+.1),HZ+(HZ-uv.y)*.9+rip*.05*d);
  vec3 rf=sky(ru);float tr=tree(ru.x*asp);
  rf=mix(rf,vec3(.03,.038,.05),smoothstep(tr+.004,tr-.004,ru.y));
  col=mix(vec3(.012,.02,.03),rf*.8,mix(.92,.4,d)*(.8+.5*rip));
  col+=rf*pow(smoothstep(.55,.85,w2+rip*.3),3.)*(.5+.8*(1.-d));
  col=mix(col,vec3(.3,.31,.38)*.55,exp(-d*12.)*.5);
 }
 float bh=.03*n(vec2(uv.x*asp*70.,2.))+.02*n(vec2(uv.x*asp*16.,5.))-.008;
 col=mix(col,vec3(.006,.01,.01),smoothstep(bh+.003,bh-.003,uv.y));
 col*=1.-.45*pow(length((uv-.5)*vec2(1.,.9)),2.4);
 col+=(h(gl_FragCoord.xy+T)-.5)*.03;
 gl_FragColor=vec4(pow(max(col,0.),vec3(.92)),1.);
}

/* flapping dove: mesh-warp the photo so the wings beat and bend */
(function(){var cd=document.getElementById('dv'),x=cd.getContext('2d'),I=new Image(),GX=13,GY=20,SW=314,SH=506,K=.75,V=[],Q=[],Sx=150,Sy=238,Fx=205,Fy=322;
function sm(a,b,v){v=(v-a)/(b-a);v=v<0?0:v>1?1:v;return v*v*(3-2*v)}
function tri(a,b,c,ua,va,ub,vb,uc,vc){var cx=(a[0]+b[0]+c[0])/3,cy=(a[1]+b[1]+c[1])/3;function e(p){var dx=p[0]-cx,dy=p[1]-cy,l=Math.hypot(dx,dy)||1;return[p[0]+dx/l*.8,p[1]+dy/l*.8]}

 x.save();x.beginPath();x.moveTo(A[0],A[1]);x.lineTo(B[0],B[1]);x.lineTo(C[0],C[1]);x.closePath();x.clip();
 x.transform((a[0]*(vb-vc)+b[0]*(vc-va)+c[0]*(va-vb))/d,(a[1]*(vb-vc)+b[1]*(vc-va)+c[1]*(va-vb))/d,
  (a[0]*(uc-ub)+b[0]*(ua-uc)+c[0]*(ub-ua))/d,(a[1]*(uc-ub)+b[1]*(ua-uc)+c[1]*(ub-ua))/d,
  (a[0]*(ub*vc-uc*vb)+b[0]*(uc*va-ua*vc)+c[0]*(ua*vb-ub*va))/d,(a[1]*(ub*vc-uc*vb)+b[1]*(uc*va-ua*vc)+c[1]*(ub*va*0+ua*vb-ub*va))/d);
 x.drawImage(I,0,0);x.restore()}

 for(j=0;j<GY;j++)for(i=0;i<GX;i++){var k=j*(GX+1)+i;Q.push([k,k+1,k+GX+2],[k,k+GX+2,k+GX+1])}

 V.forEach(function(w){var dx=w.u-Sx,dy=w.v-Sy,a=tn*w.n,k=1-.16*fd*w.n,px=w.u+(Sx+(dx*Math.cos(a)-dy*Math.sin(a))*k-w.u),py=w.v+(Sy+(dx*Math.sin(a)+dy*Math.cos(a))*k-w.v);
  dx=w.u-Fx;dy=w.v-Fy;a=tf*w.f;px+=Fx+dx*Math.cos(a)-dy*Math.sin(a)-w.u;py+=Fy+dx*Math.sin(a)+dy*Math.cos(a)-w.v;P2.push([px*K,py*K])});

 Q.forEach(function(q){var a=V[q[0]],b=V[q[1]],c=V[q[2]];tri(P2[q[0]],P2[q[1]],P2[q[2]],a.u*K,a.v*K,b.u*K,b.v*K,c.u*K,c.v*K)});
 requestAnimationFrame(draw)}
I.src=DOVE})();
